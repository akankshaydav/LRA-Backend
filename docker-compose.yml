services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: lra, POSTGRES_PASSWORD: lra, POSTGRES_DB: lra }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://lra:lra@db:5432/lra
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
